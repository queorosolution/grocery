# Runs on every pull request. Every check from docs/11-security-audit.md section 3
# must pass before merge.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
      REQUIRE_TEST_DB: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install analysis tools (pinned)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Contracts match schema and generated code
        run: make check-contracts
      - name: gofmt, vet
        run: make lint
      - name: staticcheck
        working-directory: backend
        run: staticcheck ./...
      - name: gosec
        working-directory: backend
        run: gosec -exclude-generated -quiet ./...
      - name: govulncheck
        working-directory: backend
        run: govulncheck ./...
      - name: Tests with the race detector (real Postgres)
        working-directory: backend
        run: go test -race ./...
      - name: Migrations and schema tests (expects 30 passed, 0 failed)
        run: make test-schema

  template:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true
      - name: Validate and lint the SAM template
        run: make validate
      - name: Build all four functions
        run: make build

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The web app arrives in a later step; until web/package.json exists this job passes.
      - id: web
        run: |
          if [ -f web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.web.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.web.outputs.present == 'true'
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          # The generated rewrite file must be up to date (docs/08 section 11.2).
          npm run gen:redirects
          git diff --exit-code -- public/_redirects
          # Build with the example config: next build, then the CSP hashes and their check.
          cp .env.example .env.production.local
          npm run build
          npm run check:csp
          npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # The release binary is used instead of gitleaks-action, which needs a licence for organisations.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -O "${base}/${archive}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          ./gitleaks detect --no-banner --redact
